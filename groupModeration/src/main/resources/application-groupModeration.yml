# =============================================================================
# 群图片本地审核模块（groupModeration）
# 初筛：Inception NSFW ONNX（五分类）
# 精判：NudeNet 640m ONNX（检测框 + 聚合规则）
# =============================================================================
logging:
  level:
    com.bot.groupModeration: info
group-moderation:
  enable: false
  # 初筛模型：299（Inception，推荐）
  model-variant: 299
  model-input-size: 299
  # 初筛置信度阈值（百分比），≥ 此值进入 NudeNet 精判
  prescreen-threshold: 60
  onnx-threads: 1
  task-queue-capacity: 256
  refine-queue-capacity: 256
  nudenet:
    enable: true
    # 可选外部路径；默认 classpath nudenet_640m.onnx
    input-size: 640
    nms-iou-threshold: 0.45
    min-detection-score: 0.01
  storage-base-path: ./data/moderation/storage
  storage-retention-days: 7
  storage-cleanup-cron: "0 0 3 * * ?"
  notify:
    enable: false
    target-group-id: 0
    at-user-ids: [ ]
  groups:
    - group-id: 0
      enable: false
      ban-enable: false
      ban-duration-seconds: 600
      recall-enable: true
      save-enable: true
      notify-enable: false
      notify-group-id: 0
      notify-at-user-ids: [ ]
      exempt-user-ids: [ ]
      # 群级初筛阈值（百分比）；0.60=60%，也可写 60
      nsfw-ratio-threshold: 0.60
